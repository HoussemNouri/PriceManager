# docker/nginx/default.conf

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    location / {
        # Si le fichier n'existe pas, essayer de l'envoyer à index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # On utilise le nom du service PHP tel que défini dans docker-compose.yml
        fastcgi_pass price-manager-php-fpm:9000;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        
        # Inclusions de paramètres standards
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Bloquer l'accès aux fichiers sensibles de Symfony
    location ~ /\.env|composer\.json|yaml$ {
        deny all;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

}